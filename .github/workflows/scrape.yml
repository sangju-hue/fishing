name: Scrape booking status
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scrapers/scrape_sunsang24.py
      - run: python scrapers/scrape_homepages.py || true
      - run: |
          git config user.name "bot"
          git config user.email "bot@local"
          git add data/status.json
          git diff --staged --quiet || (git commit -m "update status" && git push)
