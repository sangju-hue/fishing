<body>
<main class="page">
  <div class="topbar">
    <p class="snapshot"><strong>2026-10-02 17:17 기준</strong> · 실제 현황은 예약처에서 다시 확인하세요.</p>
  </div>

  <section class="controls" aria-label="선사 필터">
    <div class="field"><label for="search">배 이름 · 항구 검색</label><input id="search" type="search" placeholder="예: 오천항, 해모수호"></div>
    <div class="field"><label for="portFilter">항구</label><select id="portFilter"><option value="">전체 항구</option></select></div>
  </section>

  <section aria-label="월간 예약 현황">
    <nav class="month-filter" aria-label="표시할 월 선택">
      <button type="button" data-month="0" aria-pressed="false">전체</button>
      <button type="button" data-month="9" aria-pressed="false">9월</button>
      <button type="button" data-month="10" aria-pressed="false">10월</button>
      <button type="button" data-month="11" aria-pressed="false">11월</button>
    </nav>
    <div class="legend" aria-label="예약 현황 범례"><strong>범례</strong><span class="legend-item">🟢 숫자 = 잔여석</span><span class="legend-item">🔴 마감</span><span class="legend-item">⚪ 출항취소</span><span class="legend-item">· 미확인</span></div>
    <div class="matrix-meta"><span id="matrixCount"></span><span>선사 이름은 선택, 초록 셀은 해당 날짜 예약으로, 미확인 셀은 해당 선사 예약처로 이동합니다.</span></div>
    <div class="matrix-wrap" id="matrixWrap" tabindex="0" aria-label="가로로 스크롤 가능한 월간 예약 현황표">
      <table class="matrix" id="matrixTable"></table>
    </div>
  </section>

  <div class="alert-bar" id="alertBar" hidden aria-live="polite">
    <button class="alert-button" id="alertButton" type="button"></button>
    <span class="alert-note" id="alertMessage"></span>
  </div>

  <section class="details" aria-live="polite">
    <div class="result-head"><h2 id="selectedTitle"></h2><span class="count" id="resultCount"></span></div>
    <div class="cards" id="boatCards"></div>
  </section>

  <section class="directory" aria-labelledby="directoryTitle">
    <div class="directory-head"><h2 id="directoryTitle">자체 홈페이지가 없는 선사</h2><span class="count" id="directoryCount"></span></div>
    <div class="directory-list" id="directoryList"></div>
    <p class="footer-note">요금과 운항 여부가 미확인인 선사는 예약 전에 홈페이지·밴드·전화로 확인해 주세요.</p>
  </section>
</main>
<script>
const TELEGRAM_BOT_USERNAME = "";
let BOATS=[];
let STATUS={};
async function loadData(){
  try{
    const [boatsRes,statusRes]=await Promise.all([fetch('data/boats.json'),fetch('data/status.json')]);
    const boatsData=await boatsRes.json();
    BOATS=boatsData.boats||boatsData;
    const statusData=await statusRes.json();
    const codeMap={available:'a',full:'f',cancelled:'c'};
    STATUS={};
    const dates=statusData.dates||{};
    for(const [date,boats] of Object.entries(dates)){
      STATUS[date]={};
      for(const [name,info] of Object.entries(boats)){
        const code=codeMap[info.status];
        if(code)STATUS[date][name]=[code,info.remaining||0];
      }
    }
  }catch(e){console.error('데이터 로드 실패:',e);}
}



let selectedDate="2026-10-02";
let activeMonth=-1;
const selectedBoatIds=new Set();
const alertDates=new Set();
let alertFeedback="";
const todayKey="2026-10-02";
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const dateKey=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const hasOwnBookingPage=boat=>Boolean(boat.channels.homepage||boat.channels.sunsang24||boat.channels.naver);
const onlineBoats=()=>BOATS.filter(hasOwnBookingPage);
const offlineBoats=()=>BOATS.filter(boat=>!hasOwnBookingPage(boat));
const primaryUrl=boat=>boat.channels.sunsang24||boat.channels.homepage||boat.channels.naver||boat.channels.band||"";
const channelNames={sunsang24:"선상24",band:"밴드",naver:"네이버예약",homepage:"홈페이지",phone:"전화"};
function bookingUrl(boat,date=selectedDate){
  const raw=boat.channels.sunsang24||"";
  if(!raw)return primaryUrl(boat);
  if(raw.includes("/ship/board_detail/"))return raw;
  try{
    const url=new URL(raw);
    return `https://${url.hostname}/ship/schedule_fleet/${date.slice(0,7).replace("-","")}#d${date}`;
  }catch(error){return raw}
}
function statusInfo(boat,date=selectedDate){
  const isLaterDuplicate=boat.bid>=42&&BOATS.some(item=>item.bid<42&&item.name===boat.name);
  const row=!isLaterDuplicate&&STATUS[date]&&STATUS[date][boat.name];
  if(!row)return {cls:"unknown",short:"·",text:"⚪ 현황 미확인"};
  if(row[0]==="a")return {cls:"available",short:String(row[1]),text:`🟢 ${row[1]}자리 남음`};
  if(row[0]==="f")return {cls:"full",short:"마감",text:"🔴 마감"};
  return {cls:"cancelled",short:"취소",text:"⚪ 출항취소"};
}
const PORT_ALIASES=[
  [/^대천항(?:\s*\(|$)/,"대천항"],[/^전곡항(?:\s*\(|$)/,"전곡항"],[/^신진도$/,"신진도항"],
  [/^비응항(?:\s*\(|$)/,"비응항"],[/^남항/,"남항"],[/^영흥도(?:\s*\(|$)/,"영흥도"],
  [/^삼천포(?:\s*\(|$)/,"삼천포"]
];
function normalizePort(port){
  const value=String(port||"미확인").trim();
  const alias=PORT_ALIASES.find(([pattern])=>pattern.test(value));
  return alias?alias[1]:value;
}
function matches(boat){
  const q=$("#search").value.trim().toLowerCase();
  const port=$("#portFilter").value;
  const text=[boat.name,boat.operator,boat.region,normalizePort(boat.port),boat.notes].filter(Boolean).join(" ").toLowerCase();
  return (!q||text.includes(q))&&(!port||normalizePort(boat.port)===port);
}
function matrixOperatorName(boat){return boat.operator||"기타"}
function sortedBoats(){return onlineBoats().filter(matches).slice().sort((a,b)=>{
  const operatorA=matrixOperatorName(a),operatorB=matrixOperatorName(b);
  if(operatorA==="기타"&&operatorB!=="기타")return 1;
  if(operatorB==="기타"&&operatorA!=="기타")return -1;
  return operatorA.localeCompare(operatorB,"ko")||a.name.localeCompare(b.name,"ko");
})}
function groupedOnlineBoats(){
  const groups=new Map();
  sortedBoats().forEach(boat=>{
    const operator=matrixOperatorName(boat);
    if(!groups.has(operator))groups.set(operator,[]);
    groups.get(operator).push(boat);
  });
  return [...groups];
}
function operatorName(boat){return boat.operator||"기타 선사"}
function displayNames(boat){return [boat.name]}
function sortedOfflineBoats(){return offlineBoats().filter(matches).slice().sort((a,b)=>a.region.localeCompare(b.region,"ko")||((a.operator===null)-(b.operator===null))||operatorName(a).localeCompare(operatorName(b),"ko")||a.name.localeCompare(b.name,"ko"))}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
function safeHref(key,value){
  if(key==="phone")return `tel:${String(value).replace(/[^0-9+]/g,"")}`;
  try{const url=new URL(value);return ["http:","https:"].includes(url.protocol)?url.href:""}catch(error){return ""}
}
function channelButtons(boat,keys=Object.keys(boat.channels)){
  const entries=keys.filter(key=>boat.channels[key]).map(key=>[key,boat.channels[key]]);
  if(!entries.length)return '<span class="no-channel">등록된 예약 연락처 없음</span>';
  return entries.map(([key,value])=>{
    const href=key==="sunsang24"?bookingUrl(boat):safeHref(key,value);
    if(!href)return "";
    const target=key==="phone"?"":' target="_blank" rel="noopener noreferrer"';
    const label=key==="phone"?`전화 ${escapeHtml(value)}`:channelNames[key]||key;
    return `<a class="channel" href="${escapeHtml(href)}"${target} data-channel-link>${label}</a>`;
  }).join("")||'<span class="no-channel">등록된 예약 연락처 없음</span>';
}
function priceLine(boat){
  if(!boat.price)return '<span>요금 · 정원 <strong>정보 없음</strong></span>';
  if(boat.price.includes("인승"))return `<span>정원: <strong>${boat.capacity}명</strong></span>`;
  return `<span>1인 요금: <strong>${boat.price}</strong></span>`;
}
function card(boat){
  const status=boat.channels.sunsang24?statusInfo(boat):{cls:"unknown",short:"·",text:"⚪ 현황 미확인"},url=bookingUrl(boat),clickable=Boolean(url);
  const tags=(boat.tags||[]).length?`<div class="tags">${boat.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`:"";
  return `<article class="boat-card${clickable?' clickable':''}"${clickable?` tabindex="0" role="link" data-url="${url}" aria-label="${boat.name} ${selectedDate} 예약 페이지 열기"`:""}>
    <div class="card-top"><div class="boat-name">${boat.name}</div><span class="status ${status.cls}">${status.text}</span></div>
    <div class="meta"><span><strong>${boat.region}</strong> · ${normalizePort(boat.port)}</span>${priceLine(boat)}</div>
    ${tags}<div class="channels">${channelButtons(boat)}</div>
  </article>`;
}
function renderCards(){
  const selected=onlineBoats().filter(boat=>selectedBoatIds.has(boat.bid)&&matches(boat)).sort((a,b)=>a.region.localeCompare(b.region,"ko")||a.name.localeCompare(b.name,"ko"));
  $("#selectedTitle").textContent=`${Number(selectedDate.slice(5,7))}월 ${Number(selectedDate.slice(8,10))}일 선택 선사`;
  $("#resultCount").textContent=selected.length?`선택 ${selected.length}곳 · 예약 데이터 ${selected.filter(b=>STATUS[selectedDate]&&STATUS[selectedDate][b.name]).length}곳`:"";
  $("#boatCards").innerHTML=selected.length?selected.map(card).join(""):'<div class="empty">선사 이름을 클릭해서 선택해주세요</div>';
  bindCardActions();
}
function bindCardActions(){
  document.querySelectorAll(".boat-card[data-url]").forEach(el=>{
    const open=()=>window.open(el.dataset.url,"_blank","noopener,noreferrer");
    el.addEventListener("click",e=>{if(!e.target.closest("a"))open()});
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
  });
}
function renderDirectory(){
  const boats=sortedOfflineBoats();
  const regions=new Map();
  boats.forEach(boat=>{
    if(!regions.has(boat.region))regions.set(boat.region,new Map());
    const operators=regions.get(boat.region),operator=operatorName(boat);
    if(!operators.has(operator))operators.set(operator,[]);
    operators.get(operator).push(boat);
  });
  $("#directoryCount").textContent=`${boats.length}개 등록 항목 · ${[...regions.values()].reduce((total,groups)=>total+groups.size,0)}개 선사 그룹`;
  $("#directoryList").innerHTML=boats.length?[...regions].map(([region,operators])=>`<section class="region-group" aria-labelledby="region-${escapeHtml(region)}">
    <h3 class="region-heading" id="region-${escapeHtml(region)}">${escapeHtml(region)}</h3>
    <div class="operator-grid">${[...operators].map(([operator,list])=>`<section class="operator-group">
      <div class="operator-head"><span class="operator-name">${escapeHtml(operator)}</span><span class="operator-count">${list.reduce((total,boat)=>total+displayNames(boat).length,0)}척</span></div>
      <div class="operator-boats">${list.map(boat=>displayNames(boat).map(name=>`<article class="directory-item">
        <div class="directory-copy"><div class="directory-name">${escapeHtml(name)}</div><div class="directory-meta">${escapeHtml(boat.region)} · ${escapeHtml(normalizePort(boat.port))} · ${escapeHtml(boat.price||"요금 미확인")}</div>${boat.notes?`<p class="directory-note">${escapeHtml(boat.notes)}</p>`:""}</div>
        <div class="directory-actions">${channelButtons(boat,["homepage","naver","band","phone"])}</div>
      </article>`).join("")).join("")}</div>
    </section>`).join("")}</div>
  </section>`).join(""):'<div class="empty">조건에 맞는 선사가 없습니다.</div>';
}
function allDates(){
  const dates=[];
  for(let month=8;month<=10;month++){
    const total=new Date(2026,month+1,0).getDate();
    for(let d=1;d<=total;d++)dates.push({key:dateKey(2026,month,d),month,d,dow:new Date(2026,month,d).getDay()});
  }
  if(activeMonth===-1)return dates.filter(item=>item.month+1>=10);
  return activeMonth?dates.filter(item=>item.month+1===activeMonth):dates;
}
function renderMatrix(){
  const dates=allDates(),groups=groupedOnlineBoats(),boats=groups.flatMap(([,list])=>list);
  const monthGroups=activeMonth===-1?[{label:"10월",days:31},{label:"11월",days:30}]:activeMonth?[{label:`${activeMonth}월`,days:dates.length}]:[{label:"9월",days:30},{label:"10월",days:31},{label:"11월",days:30}];
  let html='<thead><tr><th class="boat-col" scope="col" rowspan="2">선사 · 배 · 항구</th>';
  monthGroups.forEach(group=>html+=`<th class="month-group" scope="colgroup" colspan="${group.days}">${group.label}</th>`);
  html+='</tr><tr>';
  dates.forEach(item=>{
    const dayName="일월화수목금토"[item.dow],isPast=item.key<todayKey;
    const cls=`date-head ${item.dow===0?'sun':item.dow===6?'sat':''} ${item.key===selectedDate?'selected-col':''} ${isPast?'past':''}`;
    html+=`<th scope="col"><button class="${cls}" type="button" data-date="${item.key}" aria-label="${item.month+1}월 ${item.d}일 ${dayName}요일 상세 보기"><span>${item.d}</span><span class="dow">${dayName}</span></button><label class="watch-date" title="${item.month+1}월 ${item.d}일 빈자리 알림"><input type="checkbox" data-alert-date="${item.key}" ${alertDates.has(item.key)?"checked":""} aria-label="${item.month+1}월 ${item.d}일 빈자리 알림 날짜 선택"></label></th>`;
  });
  html+='</tr></thead><tbody>';
  groups.forEach(([operator,groupBoats],groupIndex)=>{
    const tone=groupIndex%2===0?"group-even":"group-odd";
    const allSelected=groupBoats.every(boat=>selectedBoatIds.has(boat.bid));
    html+=`<tr class="operator-header-row ${tone}"><th class="boat-col" scope="rowgroup"><button class="operator-selector" type="button" data-group-index="${groupIndex}" aria-pressed="${allSelected}" aria-label="${escapeHtml(operator)} 소속 ${groupBoats.length}척 ${allSelected?'전체 선택 해제':'전체 선택'}"><span class="operator-title">${escapeHtml(operator)}</span><span class="operator-total">(${groupBoats.length}척)</span></button></th><td class="operator-fill" colspan="${dates.length}" aria-hidden="true"></td></tr>`;
    groupBoats.forEach((boat,boatIndex)=>{
      const isSelected=selectedBoatIds.has(boat.bid),isLast=boatIndex===groupBoats.length-1;
      html+=`<tr class="boat-row ${tone}${isLast?' group-end':''}"><th class="boat-col" scope="row" title="${escapeHtml(boat.name)} · ${escapeHtml(boat.port)}"><button class="boat-selector" type="button" data-boat-id="${boat.bid}" aria-pressed="${isSelected}" aria-label="${escapeHtml(boat.name)} ${isSelected?'선택 해제':'선택'}"><span class="boat-label">${escapeHtml(boat.name)}</span><span class="port-label">${escapeHtml(boat.region)} · ${escapeHtml(normalizePort(boat.port))}</span></button></th>`;
      dates.forEach(item=>{
        const info=boat.channels.sunsang24?statusInfo(boat,item.key):{cls:"unknown",short:"·",text:"⚪ 현황 미확인"},selected=item.key===selectedDate?' selected-col':'',past=item.key<todayKey?' past':'';
        const opensBooking=info.cls==='available'||!boat.channels.sunsang24;
        html+=`<td class="${(selected+past).trim()}"><button class="status-cell ${info.cls}" type="button" data-date="${item.key}" data-boat-id="${boat.bid}" data-status="${info.cls}" aria-label="${escapeHtml(boat.name)}, ${item.month+1}월 ${item.d}일, ${info.text}${opensBooking?', 예약 페이지 열기':', 상세 보기'}">${info.short}</button></td>`;
      });
      html+='</tr>';
    });
  });
  if(!boats.length)html+=`<tr class="empty-row"><td colspan="${dates.length+1}">조건에 맞는 선사가 없습니다.</td></tr>`;
  html+='</tbody>';
  $("#matrixTable").innerHTML=html;
  $("#matrixTable").style.setProperty("--date-count",dates.length);
  const range=activeMonth===-1?"10월 1일–11월 30일, 61일":activeMonth?`${activeMonth}월 1일–${activeMonth}월 ${dates.length}일, ${dates.length}일`:`9월 1일–11월 30일, 91일`;
  $("#matrixCount").innerHTML=`<b>${boats.length}척</b> · ${groups.length}개 선사 그룹 · ${range} 현황`;
  document.querySelectorAll(".date-head[data-date]").forEach(btn=>btn.addEventListener("click",()=>selectDate(btn.dataset.date)));
  document.querySelectorAll("[data-alert-date]").forEach(input=>input.addEventListener("change",()=>toggleAlertDate(input)));
  document.querySelectorAll(".operator-selector[data-group-index]").forEach(btn=>btn.addEventListener("click",()=>toggleOperator(groups[Number(btn.dataset.groupIndex)][1])));
  document.querySelectorAll(".boat-selector[data-boat-id]").forEach(btn=>btn.addEventListener("click",()=>toggleBoat(Number(btn.dataset.boatId))));
  document.querySelectorAll(".status-cell[data-date]").forEach(btn=>btn.addEventListener("click",()=>handleStatusClick(Number(btn.dataset.boatId),btn.dataset.date,btn.dataset.status)));
}
function toggleOperator(boats){
  const allSelected=boats.every(boat=>selectedBoatIds.has(boat.bid));
  if(allSelected){
    boats.forEach(boat=>selectedBoatIds.delete(boat.bid));
    alertFeedback="";
  }else{
    const nextIds=new Set(selectedBoatIds);
    boats.forEach(boat=>nextIds.add(boat.bid));
    if(alertDates.size&&nextIds.size*alertDates.size>4){
      alertFeedback="알림은 배×날짜 조합을 최대 4개까지 선택할 수 있어요.";
      renderAlertBar();
      return;
    }
    boats.forEach(boat=>selectedBoatIds.add(boat.bid));
    alertFeedback="";
  }
  renderMatrix();renderCards();renderAlertBar();
}
function toggleBoat(bid){
  if(selectedBoatIds.has(bid)){
    selectedBoatIds.delete(bid);
    alertFeedback="";
  }else{
    if(alertDates.size&&(selectedBoatIds.size+1)*alertDates.size>4){
      alertFeedback="알림은 배×날짜 조합을 최대 4개까지 선택할 수 있어요.";
      renderAlertBar();
      return;
    }
    selectedBoatIds.add(bid);
    alertFeedback="";
  }
  renderMatrix();renderCards();renderAlertBar();
}
function toggleAlertDate(input){
  const key=input.dataset.alertDate;
  if(input.checked){
    if(alertDates.size>=4||selectedBoatIds.size&&(alertDates.size+1)*selectedBoatIds.size>4){
      input.checked=false;
      alertFeedback="알림은 배×날짜 조합을 최대 4개까지 선택할 수 있어요.";
      renderAlertBar();
      return;
    }
    alertDates.add(key);
  }else alertDates.delete(key);
  alertFeedback="";
  renderAlertBar();
}
function alertPairs(){
  const boatIds=[...selectedBoatIds].sort((a,b)=>a-b);
  const dates=[...alertDates].sort();
  return boatIds.flatMap(bid=>dates.map(date=>({bid,date})));
}
function renderAlertBar(){
  const pairs=alertPairs(),bar=$("#alertBar"),button=$("#alertButton"),message=$("#alertMessage");
  bar.hidden=!pairs.length&&!alertFeedback;
  message.textContent=alertFeedback||(!TELEGRAM_BOT_USERNAME&&pairs.length?"봇이 연결되면 선택한 조합을 바로 구독할 수 있어요.":"");
  message.classList.toggle("is-error",Boolean(alertFeedback));
  if(!pairs.length){button.hidden=true;return}
  button.hidden=false;
  button.textContent=TELEGRAM_BOT_USERNAME?`🔔 빈자리 알림 받기 (${pairs.length}개)`:"🔔 알림 봇 준비 중";
  button.disabled=!TELEGRAM_BOT_USERNAME;
  button.dataset.start=`w_${pairs.map(pair=>`${pair.bid}_${pair.date.replaceAll("-","")}`).join("-")}`;
}
function openTelegramAlert(){
  if(!TELEGRAM_BOT_USERNAME)return;
  const start=$("#alertButton").dataset.start;
  window.open(`https://t.me/${TELEGRAM_BOT_USERNAME}?start=${encodeURIComponent(start)}`,"_blank","noopener,noreferrer");
}
function handleStatusClick(bid,date,status){
  selectedDate=date;
  const boat=BOATS.find(item=>item.bid===bid);
  if(boat&&!boat.channels.sunsang24){
    const url=primaryUrl(boat);
    if(url)window.open(url,"_blank","noopener,noreferrer");
    renderMatrix();renderCards();
    return;
  }
  if(status==="available"){
    if(boat)window.open(bookingUrl(boat,date),"_blank","noopener,noreferrer");
    renderMatrix();renderCards();
    return;
  }
  if(!selectedBoatIds.has(bid)&&alertDates.size&&(selectedBoatIds.size+1)*alertDates.size>4){
    alertFeedback="알림은 배×날짜 조합을 최대 4개까지 선택할 수 있어요.";
    renderAlertBar();
  }else selectedBoatIds.add(bid);
  selectDate(date);
}
function selectDate(key){
  selectedDate=key;
  renderMatrix();renderCards();
  requestAnimationFrame(()=>{
    const selected=$(".date-head.selected-col");
    if(selected)selected.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  });
}
function initPorts(){
  const counts=new Map();
  BOATS.forEach(boat=>{const port=normalizePort(boat.port);counts.set(port,(counts.get(port)||0)+1)});
  [...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ko")).forEach(([port,count])=>{
    $("#portFilter").insertAdjacentHTML("beforeend",`<option value="${escapeHtml(port)}">${escapeHtml(port)} (${count})</option>`);
  });
}
document.querySelectorAll(".month-filter button").forEach(btn=>btn.addEventListener("click",()=>{
  activeMonth=Number(btn.dataset.month);
  document.querySelectorAll(".month-filter button").forEach(item=>{const on=item===btn;item.classList.toggle("active",on);item.setAttribute("aria-pressed",String(on))});
  if(activeMonth&&Number(selectedDate.slice(5,7))!==activeMonth)selectedDate=`2026-${pad(activeMonth)}-01`;
  renderMatrix();renderCards();renderAlertBar();
  $("#matrixWrap").scrollLeft=0;
}));
["#search","#portFilter"].forEach(id=>$(id).addEventListener(id==="#search"?"input":"change",()=>{renderMatrix();renderCards();renderDirectory()}));
$("#alertButton").addEventListener("click",openTelegramAlert);
loadData().then(()=>{initPorts();renderMatrix();renderCards();renderDirectory();renderAlertBar();});
</script>
</body>
</html>
